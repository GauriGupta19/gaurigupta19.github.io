name: Fetch X Bookmarks

on:
  schedule:
    # Run daily at 9:00 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering from GitHub Actions UI

permissions:
  contents: write # Required to commit and push changes

jobs:
  fetch-bookmarks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Get X access token
        id: get-token
        env:
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN || secrets.X_BEARER_TOKEN }}
        run: |
          if [ -n "$X_REFRESH_TOKEN" ] && [ -n "$X_CLIENT_ID" ] && [ -n "$X_CLIENT_SECRET" ]; then
            echo "Refreshing X access token..."
            basic=$(echo -n "${X_CLIENT_ID}:${X_CLIENT_SECRET}" | base64)
            resp=$(curl -sS -X POST 'https://api.x.com/2/oauth2/token' \
              -H "Authorization: Basic $basic" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'grant_type=refresh_token' \
              --data-urlencode "refresh_token=$X_REFRESH_TOKEN")
            token=$(echo "$resp" | jq -r '.access_token // empty')
            if [ -z "$token" ]; then
              echo "::error::Failed to refresh token: $resp"
              exit 1
            fi
            echo "access_token=$token" >> $GITHUB_OUTPUT
          else
            echo "access_token=$X_ACCESS_TOKEN" >> $GITHUB_OUTPUT
          fi

      - name: Fetch X bookmarks
        env:
          X_ACCESS_TOKEN: ${{ steps.get-token.outputs.access_token }}
          X_USERNAME: ${{ secrets.X_USERNAME || 'gauri__gupta' }}
          MAX_BOOKMARKS: ${{ secrets.MAX_BOOKMARKS || '5' }}
        run: npm run fetch-x-bookmarks

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/news.ts
          git commit -m "chore: update X bookmarks [skip ci]"
          git push

