name: Fetch X Bookmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-bookmarks:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Fetch X bookmarks
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_USERNAME: ${{ secrets.X_USERNAME || 'gauri__gupta' }}
          MAX_BOOKMARKS: ${{ secrets.MAX_BOOKMARKS || '10' }}
        run: npm run fetch-bookmarks

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/news.ts src/data/posts.ts src/pages/posts/
          git commit -m "chore: add X bookmarks to news"
          git push
